[project]
name = "intent-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mitul.solanki", email = "mitulozil@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.14.0",
    "cryptography<46",
    "datasets>=5.0.1",
    "dvc>=3.67.1",
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "mlflow>=3,<4",
    "pandas>=2.2,<3",
    "pyopenssl>=24",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "uvicorn>=0.52.3",
]

[project.scripts]
intent-classifier = "intent_classifier:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
